name: paseo-omp-canary

services:
  mock-llm:
    image: node:22.22.1-bookworm-slim@sha256:4f77a690f2f8946ab16fe1e791a3ac0667ae1c3575c3e4d0d4589e9ed5bfaf3d
    command: ["node", "/app/mock-llm.ts"]
    volumes:
      - ./mock-llm.ts:/app/mock-llm.ts:ro
    ports:
      - "127.0.0.1:${PASEO_CANARY_MOCK_PORT:-18080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const response = await fetch('http://127.0.0.1:8080/health'); process.exit(response.ok ? 0 : 1)",
        ]
      interval: 2s
      timeout: 2s
      retries: 15

  paseo:
    build:
      context: ../..
      dockerfile: paseo-omp/canary/Dockerfile
      args:
        OMP_VERSION: ${PASEO_CANARY_OMP_VERSION:-18.1.15}
        OMP_SHA256_AMD64: ${PASEO_CANARY_OMP_SHA256_AMD64:-747518a41fbb32ac47491b4677a7a921d0d9e5977ae006c358d6836813149adc}
        OMP_SHA256_ARM64: ${PASEO_CANARY_OMP_SHA256_ARM64:-2e1142ccd4bb76413b63a05711ac51c7b95551f36387ef295661bb86f0576189}
    image: ${PASEO_CANARY_IMAGE:-paseo-omp-canary:local}
    depends_on:
      mock-llm:
        condition: service_healthy
    environment:
      PASEO_PASSWORD: ${PASEO_CANARY_PASSWORD:?Set PASEO_CANARY_PASSWORD}
      PASEO_DICTATION_ENABLED: "false"
      PASEO_VOICE_MODE_ENABLED: "false"
    ports:
      - "${PASEO_CANARY_BIND:-127.0.0.1}:${PASEO_CANARY_PORT:-6768}:6767"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:6767/"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s
    volumes:
      - ${PASEO_CANARY_WORKSPACE:-../..}:/workspace/paseo-plugins
    stop_grace_period: 15s

  ollama:
    profiles: ["local-model"]
    image: ollama/ollama:0.11.10@sha256:a5409cb903d30f9cd67e9f430dd336ddc9274e16fd78f75b675c42065991b4fd
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 3s
      timeout: 3s
      retries: 30

  ollama-pull:
    profiles: ["local-model"]
    image: ollama/ollama:0.11.10@sha256:a5409cb903d30f9cd67e9f430dd336ddc9274e16fd78f75b675c42065991b4fd
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "qwen2.5:0.5b"]

volumes:
  ollama-data:
